# Fully static musl builds (used by the Dockerfile and for release binaries).
#   cargo build --release --target x86_64-unknown-linux-musl
# On Debian/Ubuntu the plain glibc `gcc` can drive the link because rustc ships
# self-contained musl crt objects; on Alpine `gcc` is already musl-native.
[target.x86_64-unknown-linux-musl]
linker = "gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
CC_x86_64_unknown_linux_musl = "gcc"
